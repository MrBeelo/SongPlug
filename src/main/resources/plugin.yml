name: SongPlug
version: '1.0-SNAPSHOT'
main: net.mrbeelo.songPlug.SongPlug
api-version: '1.21'
commands:
  class:
    description: Opens a menu for the player to change their class
  givesong:
    description: Gives the player the specified song
  getblock:
    description: Gets the block the entity is standing on
  resetcooldowns:
    description: Resets all ardoni song cooldowns
  energy:
    description: Sets the ardoni song energy amount